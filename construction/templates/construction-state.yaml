# Construction State — Template (Workstream SSOT v3/v4)
# Equivalente a workstream-state.yaml — SSOT do estado operacional por Workstream.
# Localização: <workstream-root>/construction-state.yaml
# Estado agregado da Feature: computado (STATE-AGG-01) — ver 12-fullstack-orchestrator.md

version: 3

scope:
  type: {{SCOPE_TYPE}}              # platform_foundation | business_feature
  layer: {{SCOPE_LAYER}}            # construction/platform-foundation | construction/features/<FEATURE_CODE>

feature:
  id: {{FEATURE_SLUG}}              # slug specs (ex.: authentication)
  code: {{FEATURE_CODE}}            # identificador oficial (ex.: FT-AUTH)
  name: {{FEATURE_NAME}}

depends_on: []
# Exemplo FT-AUTH:
# depends_on:
#   - platform_foundation

state:
  phase: not_started  # not_started | session | execution | closure | closed

  current_pkg: null

  completed: []

  pending: []

snapshot:
  version: 0
  created_at: null
  immutable: false

cache:
  valid: false
  reason: null

manifest:
  version: 2
  path: feature-manifest.yaml

review:
  status: pending  # pending | in_progress | done

audit:
  status: pending  # pending | in_progress | done

build:
  incremental: true
  full_verify: pending  # pending | success | failure

readiness:
  status: pending  # pending | in_progress | approved | rejected

closure:
  status: pending  # pending | in_progress | done

metrics:
  pkgs_total: 0
  pkgs_completed: 0
  tasks_total: null
  tasks_completed: null

metadata:
  created_at: null
  updated_at: null
