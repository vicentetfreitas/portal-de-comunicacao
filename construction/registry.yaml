        pkgs_total: 6

  - code: FT-SESSION
    slug: session
    name: Sessão e contexto organizacional
    sprint: 3
    golden: false
    manifest: features/FT-SESSION/feature-manifest.yaml
    aggregate_state: computed
    current_capability: null
    status: closed
    closure: FEATURE_APPROVED
    notes:
      - REF-DB-CTX-01 — persistência AUTH_SESSAO removida; escopo FE encerrado
      - status alinhado a construction-state (reconciliação Etapa 2 2026-08-13)
    workstreams:
      - id: backend
        type: backend
        order: 1
        manifest: features/FT-SESSION/feature-manifest.yaml
        state: features/FT-SESSION/construction-state.yaml
        status: closed
        closure: FEATURE_APPROVED
        pkgs_pattern: "pkg-{NN}"
        pkgs_total: 4
      - id: frontend
        type: frontend
        order: 2
        sprint: 3
        manifest: frontend/features/FT-SESSION/feature-manifest.yaml
        state: frontend/features/FT-SESSION/construction-state.yaml
        status: closed
        closure: FEATURE_APPROVED
        depends_on_workstreams:
