        pkgs_total: 2

  - code: FT-PRIMEIRO-ACESSO
    slug: primeiro-acesso
    name: Primeiro acesso e resolução de contexto
    sprint: null
    golden: false
    manifest: features/FT-PRIMEIRO-ACESSO/feature-manifest.yaml
    aggregate_state: computed
    current_capability: null
    status: execution
    closure: null
    notes:
      - BE not_started · FE execution (pkg-fe-01) — reconciliação Etapa 2 2026-08-13
    workstreams:
