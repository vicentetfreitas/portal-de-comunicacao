# Feature Manifest — FT-AREA (SSOD v3.2)
# Single Source of Discovery — consultar ANTES de qualquer outro artefato da Feature.

version: 2
role: ssod

feature:
  id: area
  code: FT-AREA
  name: Área
  description: >
    Cadastro, consulta, listagem, atualização e ativação/inativação de Áreas
    organizacionais vinculadas a Singulares, em nível único, com gestor opcional. Equipes detalham a área operacionalmente.

status:
  phase: closed

specification:
  path: ../../../specs/features/area/
  documents:
    specification: specification.md
    api: api.md
    use_cases: use-cases.md
    tasks: tasks.md
    acceptance_tests: acceptance-tests.md
    traceability: traceability.md

construction:
  path: .
  root: construction/features/FT-AREA/

implementation:
  backend:
    - ../../../backend/src/main/java/br/com/unimedceara/portalcomunicacao/organization/
  frontend: []

artifacts:
  manifest: feature-manifest.yaml
  state: construction-state.yaml
  execution_plan: execution-plan.md
  session: session.md
  closure: closure-report.md
  review: review/
  reports: reports/
  pkgs:
    - pkg-01/status.md
    - pkg-02/status.md
    - pkg-03/status.md
    - pkg-04/status.md
    - pkg-05/status.md
    - pkg-06/status.md

dependencies:
  construction:
    - code: platform-foundation
      path: ../../platform-foundation/
      manifest: ../../platform-foundation/feature-manifest.yaml
  features:
    - code: FT-AUTH
      path: ../FT-AUTH/
      manifest: ../FT-AUTH/feature-manifest.yaml
  foundation:
    - ../../../specs/foundation/
    - ../../../specs/features/FEATURE_BASELINE.md

engineering:
  implementation:
    - ../../../docs/implementation/
  construction:
    - ../../../docs/construction/
  architecture:
    - ../../../docs/architecture/

owners:
  architect: platform-architect
  implementer: feature-implementer
  orchestrator: construction-orchestrator

metrics:
  pkgs: 6
  stories: null
  tasks: 5

pkgs:
  - id: pkg-01
    name: Organization Scaffold & Persistence
  - id: pkg-02
    name: Create Area
  - id: pkg-03
    name: Read & List
  - id: pkg-04
    name: Update Area
  - id: pkg-05
    name: Status Change
  - id: pkg-06
    name: Acceptance & Closure

invalidation:
  triggers:
    - specification
    - api
    - use_cases
    - domain
    - decisions
    - adr
    - pkg_added
    - pkg_removed
    - manifest

discovery:
  version: 1
  rule: SSOD-01 — este manifesto é o ponto de entrada obrigatório para localizar artefatos da Feature
