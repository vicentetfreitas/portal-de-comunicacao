# Feature Registry — Construction Framework v3.2
# ⚠️ LEGADO — preferir construction/registry.yaml (v4.1 Full Stack)
# Este arquivo permanece como alias retrocompatível (RETRO-01).

version: 1
superseded_by: ../registry.yaml
framework: "3.2"

convention:
  format: "FT-<DOMAIN>"
  case: uppercase
  directory: "construction/features/<code>/"
  reference: "construction/features/README.md"

features:
  - code: FT-AUTH
    slug: authentication
    name: Authentication
    sprint: 1
    manifest: FT-AUTH/feature-manifest.yaml
    status: closed

  - code: FT-AREA
    slug: area
    name: Área
    sprint: 2
    manifest: FT-AREA/feature-manifest.yaml
    status: closed

  - code: FT-SINGULAR
    slug: singular
    name: Singular
    sprint: 3
    manifest: FT-SINGULAR/feature-manifest.yaml
    status: closed
    frontend:
      sprint: 2
      manifest: ../frontend/features/FT-SINGULAR/feature-manifest.yaml
      status: closed
      closure: FEATURE_APPROVED

  - code: FT-EQUIPE
    slug: equipe
    name: Equipe
    sprint: 3
    manifest: FT-EQUIPE/feature-manifest.yaml
    status: closed
    frontend:
      sprint: 3
      manifest: ../frontend/features/FT-EQUIPE/feature-manifest.yaml
      status: closed
      closure: FEATURE_APPROVED

  - code: FT-COLABORADOR
    slug: colaborador
    name: Colaborador
    sprint: 3
    manifest: FT-COLABORADOR/feature-manifest.yaml
    status: closed
