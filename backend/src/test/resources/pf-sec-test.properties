application.name=portal-comunicacao
application.version=0.0.1-SNAPSHOT
application.timezone=UTC
application.locale=pt-BR
application.security.jwt-issuer=portal-comunicacao
application.security.jwt-secret=test-jwt-secret-32-characters-minimum
application.security.jwt-access-ttl-minutes=15
application.security.refresh-token-ttl-hours=8
application.security.refresh-token-remember-me-days=30
application.security.max-concurrent-sessions=3
application.security.csrf-enabled=true
application.security.cors-allowed-origins[0]=http://localhost:4200
application.auth.frontend-redirect-url=http://localhost:4200/
application.auth.default-federation-id=1
application.persistence.pool-max-size=10
application.persistence.pool-min-idle=2
application.persistence.show-sql=false
application.persistence.ddl-auto=none
application.persistence.enabled=false
application.integration.connect-timeout-ms=5000
application.integration.read-timeout-ms=5000
application.integration.max-retry-attempts=3
application.integration.circuit-breaker-threshold=50
application.zimbra.login-page-url=http://localhost:9000/auth
application.zimbra.imap-host=mail.local.test
application.zimbra.imap-port=993
application.zimbra.imap-ssl=true
application.zimbra.smtp-host=mail.local.test
application.zimbra.smtp-port=587
application.zimbra.smtp-ssl=false
application.zimbra.smtp-starttls=true
application.zimbra.soap-url=https://mail.local.test/service/soap
application.zimbra.timeout-ms=10000
spring.datasource.url=jdbc:h2:mem:pf-slice-test;MODE=Oracle;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS unmportcom
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
