spring:
  config:
    activate:
      on-profile: test
    import: optional:file:../.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-init-sql: ${ORACLE_SESSION_CURRENT_SCHEMA_SQL:ALTER SESSION SET CURRENT_SCHEMA = UNMPORTCOM}

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:UNMPORTCOM}
        dialect: org.hibernate.community.dialect.OracleLegacyDialect

application:
  name: portal-comunicacao
  version: 0.0.1-SNAPSHOT
  timezone: UTC
  locale: pt-BR
  security:
    jwt-issuer: portal-comunicacao
    jwt-secret: test-jwt-secret-32-characters-minimum
    jwt-access-ttl-minutes: 15
    refresh-token-ttl-hours: 8
    refresh-token-remember-me-days: 30
    max-concurrent-sessions: 3
    csrf-enabled: true
    cors-allowed-origins:
      - http://localhost:4200
  auth:
    frontend-redirect-url: http://localhost:4200/
    default-federation-id: 1
    session-administrator-emails:
      - vicentefreitas@unimedceara.com.br
  persistence:
    pool-max-size: 2
    pool-min-idle: 1
    show-sql: false
    enabled: true
    integration-test-cleanup:
      # Desligado: isolamento via @Transactional/@Rollback em @IntegrationTest (DEC-DB-023).
      enabled: false
  integration:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
    max-retry-attempts: 3
    circuit-breaker-threshold: 50
  zimbra:
    login-page-url: http://localhost:9000/auth
    imap-host: mail.local.test
    imap-port: 993
    imap-ssl: true
    smtp-host: mail.local.test
    smtp-port: 587
    smtp-ssl: false
    smtp-starttls: true
    soap-url: https://mail.local.test/service/soap
    timeout-ms: 10000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

logging:
  level:
    root: WARN
