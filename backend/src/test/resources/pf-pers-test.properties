spring.datasource.url=jdbc:h2:mem:pf-pers-test;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS unmportcom
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
application.persistence.ddl-auto=create-drop
application.persistence.pool-max-size=2
application.persistence.enabled=true
application.security.jwt-issuer=portal-comunicacao
application.security.jwt-secret=test-jwt-secret-32-characters-minimum
application.security.jwt-access-ttl-minutes=15
application.security.refresh-token-ttl-hours=8
application.security.refresh-token-remember-me-days=30
application.security.max-concurrent-sessions=3
application.security.csrf-enabled=true
application.security.cors-allowed-origins[0]=http://localhost:4200
application.auth.frontend-redirect-url=http://localhost:4200/
application.auth.default-federation-id=1
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
