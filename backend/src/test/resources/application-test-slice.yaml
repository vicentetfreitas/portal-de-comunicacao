spring:
  config:
    activate:
      on-profile: test-slice

  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

application:
  name: portal-comunicacao
  version: 0.0.1-SNAPSHOT
  timezone: UTC
  locale: pt-BR
  persistence:
    enabled: false
    pool-max-size: 10
    pool-min-idle: 2
    show-sql: false
    ddl-auto: none
  security:
    jwt-issuer: portal-comunicacao
    jwt-secret: test-jwt-secret-32-characters-minimum
    jwt-access-ttl-minutes: 15
    refresh-token-ttl-hours: 8
    refresh-token-remember-me-days: 30
    max-concurrent-sessions: 3
    csrf-enabled: true
    cors-allowed-origins:
      - http://localhost:4200
  auth:
    frontend-redirect-url: http://localhost:4200/
    default-federation-id: 1
  integration:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
    max-retry-attempts: 3
    circuit-breaker-threshold: 50
  zimbra:
    login-page-url: http://localhost:9000/auth
    imap-host: mail.local.test
    imap-port: 993
    imap-ssl: true
    smtp-host: mail.local.test
    smtp-port: 587
    smtp-ssl: false
    smtp-starttls: true
    soap-url: https://mail.local.test/service/soap
    timeout-ms: 10000
