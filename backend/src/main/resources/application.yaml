application:
  name: portal-comunicacao
  version: 0.0.1-SNAPSHOT
  timezone: UTC
  locale: pt-BR
  security:
    jwt-issuer: ${JWT_ISSUER:portal-comunicacao}
    jwt-secret: ${APPLICATION_SECURITY_JWT_SECRET}
    access-token-expiration: ${APPLICATION_SECURITY_ACCESS_TOKEN_EXPIRATION:900}
    refresh-token-expiration: ${APPLICATION_SECURITY_REFRESH_TOKEN_EXPIRATION:28800}
    jwt-access-ttl-minutes: 15
    refresh-token-ttl-hours: 8
    refresh-token-remember-me-days: 30
    max-concurrent-sessions: 3
    csrf-enabled: true
    cors-allowed-origins:
      - http://localhost:4200
  auth:
    frontend-redirect-url: ${AUTH_FRONTEND_REDIRECT_URL:http://localhost:4200/}
    default-federation-id: ${AUTH_DEFAULT_FEDERATION_ID:1}
  persistence:
    pool-max-size: 10
    pool-min-idle: 2
  integration:
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
    max-retry-attempts: 3
    circuit-breaker-threshold: 50
  zimbra:
    login-page-url: ${AUTH_LOGIN_PAGE_URL}
    imap-host: ${ZIMBRA_IMAP_HOST}
    imap-port: ${ZIMBRA_IMAP_PORT:993}
    imap-ssl: ${ZIMBRA_IMAP_SSL:true}
    smtp-host: ${ZIMBRA_SMTP_HOST}
    smtp-port: ${ZIMBRA_SMTP_PORT:587}
    smtp-ssl: ${ZIMBRA_SMTP_SSL:false}
    smtp-starttls: ${ZIMBRA_SMTP_STARTTLS:true}
    soap-url: ${ZIMBRA_SOAP_URL}
    timeout-ms: ${ZIMBRA_TIMEOUT_MS:10000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

spring:
  application:
    name: portal-comunicacao
  profiles:
    default: local

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${application.persistence.pool-max-size}
      minimum-idle: ${application.persistence.pool-min-idle}
      pool-name: portal-comunicacao-pool
      # DEC-DB-024: UNMPORTCOM_APP resolve objetos do owner UNMPORTCOM na sessão JDBC
      connection-init-sql: ${ORACLE_SESSION_CURRENT_SCHEMA_SQL:ALTER SESSION SET CURRENT_SCHEMA = UNMPORTCOM}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        # Oracle: sequences/tabelas já em UPPER_SNAKE no DDL; evita validação em sq_* minúsculo.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Oracle 11g+ (CR-S1A-004): evita FETCH FIRST (12c+) → ORA-00933 em exists/limit.
        dialect: org.hibernate.community.dialect.OracleLegacyDialect
        # Schema owner dos objetos físicos (DEC-DB-024). Conexão JDBC: UNMPORTCOM_APP apenas.
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:UNMPORTCOM}

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger - %msg%n"
  file:
    name: ${RUNTIME_LOG_DIR:runtime/logs}/application.log

server:
   port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
