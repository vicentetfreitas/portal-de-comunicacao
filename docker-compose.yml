services:
  database:
    image: postgres:16-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-portal}
      POSTGRES_USER: ${DB_USER:-portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portal}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portal} -d ${DB_NAME:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-portal}
      DB_USER: ${DB_USER:-portal}
      DB_PASSWORD: ${DB_PASSWORD:-portal}
      SERVER_PORT: 8080
      ZIMBRA_IMAP_HOST: ${ZIMBRA_IMAP_HOST}
      ZIMBRA_IMAP_PORT: ${ZIMBRA_IMAP_PORT:-993}
      ZIMBRA_IMAP_SSL: ${ZIMBRA_IMAP_SSL:-true}
      ZIMBRA_SMTP_HOST: ${ZIMBRA_SMTP_HOST}
      ZIMBRA_SMTP_PORT: ${ZIMBRA_SMTP_PORT:-587}
      ZIMBRA_SMTP_SSL: ${ZIMBRA_SMTP_SSL:-false}
      ZIMBRA_SMTP_STARTTLS: ${ZIMBRA_SMTP_STARTTLS:-true}
      ZIMBRA_SOAP_URL: ${ZIMBRA_SOAP_URL}
      ZIMBRA_TIMEOUT_MS: ${ZIMBRA_TIMEOUT_MS:-10000}
      AUTH_LOGIN_PAGE_URL: ${AUTH_LOGIN_PAGE_URL:-http://localhost:9000/auth}
      AUTH_FRONTEND_REDIRECT_URL: ${AUTH_FRONTEND_REDIRECT_URL:-http://localhost:9000/app}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: portal-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_APP_ENV: ${VITE_APP_ENV:-local}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  postgres-data:
  frontend-node-modules:
