services:
  database:
    image: gvenzl/oracle-free:23-slim
    container_name: portal-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle}
      APP_USER: ${SPRING_DATASOURCE_USERNAME:-UNMPORTCOM_APP}
      APP_USER_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-oracle}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@database:1521/FREEPDB1}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-UNMPORTCOM_APP}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-oracle}
      SERVER_PORT: 8080
      # DEC-013: dentro da rede Docker o MinIO é acessado pelo nome do serviço, porta interna
      # 9000 (não confundir com a porta publicada no host, STORAGE_PORT).
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-portal-comunicacao-documentos}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_PATH_STYLE_ACCESS: ${STORAGE_PATH_STYLE_ACCESS:-true}
      ZIMBRA_IMAP_HOST: ${ZIMBRA_IMAP_HOST}
      ZIMBRA_IMAP_PORT: ${ZIMBRA_IMAP_PORT:-993}
      ZIMBRA_IMAP_SSL: ${ZIMBRA_IMAP_SSL:-true}
      ZIMBRA_SMTP_HOST: ${ZIMBRA_SMTP_HOST}
      ZIMBRA_SMTP_PORT: ${ZIMBRA_SMTP_PORT:-587}
      ZIMBRA_SMTP_SSL: ${ZIMBRA_SMTP_SSL:-false}
      ZIMBRA_SMTP_STARTTLS: ${ZIMBRA_SMTP_STARTTLS:-true}
      ZIMBRA_SOAP_URL: ${ZIMBRA_SOAP_URL}
      ZIMBRA_TIMEOUT_MS: ${ZIMBRA_TIMEOUT_MS:-10000}
      AUTH_LOGIN_PAGE_URL: ${AUTH_LOGIN_PAGE_URL:-http://localhost:9000/auth}
      AUTH_FRONTEND_REDIRECT_URL: ${AUTH_FRONTEND_REDIRECT_URL:-http://localhost:9000/app}
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: portal-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_APP_ENV: ${VITE_APP_ENV:-local}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - portal-network

  # DEC-013: Object Storage S3-compatible — dev/homologação. Porta da API deslocada para
  # 9002 (host) para não colidir com o dev server do frontend em 9000.
  minio:
    image: minio/minio:latest
    container_name: portal-minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${STORAGE_PORT:-9002}:9000"
      - "${STORAGE_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Cria o bucket na primeira subida e encerra — MinIO não cria buckets sozinho.
  minio-init:
    image: minio/mc:latest
    container_name: portal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-portal-comunicacao-documentos}
      "
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  oracle-data:
  frontend-node-modules:
  minio-data:
