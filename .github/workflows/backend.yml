# Backend CI — Opção B (D6, 2026-08-20).
#
# Roda build + testes que não exigem Oracle real. Os testes anotados com @IntegrationTest
# (perfil "test", application-test.yaml) exigem SPRING_DATASOURCE_URL apontando para um Oracle
# já provisionado com o baseline DDL — inexistente neste pipeline. São excluídos explicitamente
# abaixo, junto com ApplicationUserConnectionIntegrationTest (mesma exigência, sem guarda de skip).
# Testes "slice" (@PlatformFoundationSliceTest, H2 em modo Oracle) e unitários continuam rodando.
#
# Pipeline completo com Oracle provisionado em CI (Opção A) foi discutido e adiado — decisão
# futura, não implementada aqui.

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test (sem Oracle — testes de integração dependentes de banco real excluídos)
        run: >-
          ./mvnw clean verify
          "-Dtest=!OracleHibernateCompatibilityIntegrationTest,
          !PrimeiroAcessoAcceptanceIntegrationTest,
          !ColaboradorAcceptanceIntegrationTest,
          !AuthAcceptanceIntegrationTest,
          !EquipeAcceptanceIntegrationTest,
          !OrgCrossFeatureIntegrationTest,
          !SingularAcceptanceIntegrationTest,
          !AreaAcceptanceIntegrationTest,
          !FederacaoAcceptanceIntegrationTest,
          !AuthFlowIntegrationTest,
          !ApplicationUserConnectionIntegrationTest"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/runtime/reports/surefire/
          if-no-files-found: ignore
